coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default:
        target: 50%

  precision: 1
  round: down
  range: "60...100"

ignore:
  - cmd/**
  - internal/version/**
  - internal/testutil/**
  - queries/**
  - internal/output/**
  - internal/config/paths_windows.go
  - internal/doctor/permission_windows.go
  - internal/cli/helpers_test.go

component_management:
  individual_components:
    - component_id: cmd
      name: cmd
      paths:
        - cmd/**
    - component_id: internal
      name: internal
      paths:
        - internal/**

comment:
  layout: "header, diff, flags, components, files"
  require_changes: true
