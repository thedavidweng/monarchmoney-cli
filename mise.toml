[tools]
go = "1.27.3"
gofumpt = "0.12.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.15.0"

[tasks.build]
run = "go build ./..."

[tasks.test]
run = "go test ./..."

[tasks.test-live]
description = "Run live endpoint availability checks against the real Monarch API (requires MONARCH_LIVE_TOKEN)"
run = "go test -v -run TestLiveEndpointAvailability ./internal/monarch/"

[tasks.drift]
description = "Static API drift checks: GraphQL operation references plus orphan queries"
run = "bash scripts/check-graphql-operations.sh && go test ./queries/ -run TestNoOrphanQueries -count=1"

[tasks.fmt]
run = "gofumpt -extra -w ."

[tasks.lint]
shell = "bash -c"
run = 'mise exec -- "$(mise where go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint@2.15.0)/bin/golangci-lint" run'

[tasks.conventions]
run = '''
for f in CLAUDE.md .cursorrules .windsurfrules .clinerules GEMINI.md; do
  if [ -e "$f" ]; then echo "forbidden per-tool agent file: $f (use AGENTS.md)"; exit 1; fi
done
files=$(find cmd internal -name '*.go' ! -name '*_test.go')
total=$(cat $files | grep -cv '^[[:space:]]*$')
comments=$(cat $files | grep -E '^[[:space:]]*//' | grep -cvE '^[[:space:]]*//(go:|nolint)' || true)
if [ "$comments" -gt $((total * 5 / 100)) ]; then
  echo "comment budget exceeded: $comments comment lines > 5% of $total code lines"; exit 1
fi
'''

[tasks.signing-check]
run = "python3 build/darwin/test-signing.py"

[tasks.check]
run = ["mise run fmt", "mise run build ::: test ::: lint ::: conventions ::: signing-check"]
