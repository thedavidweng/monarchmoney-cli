name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    # Token, action pins and outputs live in the shared workflow; it mints a
    # thedavidweng-release GitHub App token, so release PRs and tags start
    # other workflows (PR checks, tag-push releases) like any other push.
    permissions: {}
    uses: thedavidweng/.github/.github/workflows/release-please.yml@3fd36efd68b432c860c8290d09c7a3c14674a209 # ci/release-please-app (thedavidweng/.github#1)
    with:
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  release-notes:
    name: Release notes
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name != '' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -e
          VERSION="${TAG#v}"
          ESCAPED_VERSION=$(printf '%s' "${VERSION}" | sed 's/\./\\./g')
          NOTES=''
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk "/^## \[${ESCAPED_VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md || true)
          fi
          INSTALL=$(printf '%s\n' \
            '# Installation' \
            '' \
            '```bash' \
            '# Homebrew (macOS)' \
            'brew install --cask thedavidweng/tap/monarchmoney-cli' \
            '' \
            '# Go (cross-platform)' \
            "go install github.com/thedavidweng/monarchmoney-cli/cmd/monarch@${TAG}" \
            '```')
          FULL_NOTES=$(printf '%s\n\n%s' "${NOTES:-Release $TAG}" "$INSTALL")
          if gh release view "$TAG" &>/dev/null; then
            gh release edit "$TAG" --notes "${FULL_NOTES}"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "${FULL_NOTES}"
          fi
