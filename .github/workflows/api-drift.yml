name: API Drift Detection

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  static-drift:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check GraphQL operation references
        run: bash scripts/check-graphql-operations.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check for orphan queries
        run: go test ./queries/ -run TestNoOrphanQueries -count=1

  live-drift:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Probe live Monarch endpoints
        env:
          MONARCH_LIVE_TOKEN: ${{ secrets.MONARCH_LIVE_TOKEN }}
        run: |
          if [ -z "${MONARCH_LIVE_TOKEN:-}" ]; then
            echo "MONARCH_LIVE_TOKEN not set; skipping live probe."
            exit 0
          fi
          go test -v -run TestLiveEndpointAvailability ./internal/monarch/ -count=1 2>&1 | tee drift-report.txt
        shell: bash
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-report
          path: drift-report.txt
      - name: File drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --state open --search 'API drift detected' --json title -q '.[].title')" ]; then
            gh issue create --label needs-triage --title "API drift detected $(date -u +%F)" --body-file drift-report.txt
          else
            echo "drift issue already open; skipping duplicate"
          fi
