name: Coverage baseline

on:
  push:
    branches: [coverage-baseline-20261101]

permissions:
  contents: read

concurrency:
  group: coverage-baseline-20261101
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Test current main with E2E coverage
        env:
          MONARCH_E2E_COVER_DIR: ${{ runner.temp }}/monarch-e2e-coverage
        run: |
          git diff --exit-code ab83084030128585db1c434f0b5cabc4e333478d -- . ':!tests/e2e/binary_test.go' ':!.github/workflows/coverage-baseline.yml'
          mkdir -p "$MONARCH_E2E_COVER_DIR"
          mise exec -- go test -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
          mise exec -- go tool covdata textfmt -i="$MONARCH_E2E_COVER_DIR" -o="${RUNNER_TEMP}/coverage-e2e.out"
          test -s coverage.out
          test -s "${RUNNER_TEMP}/coverage-e2e.out"
          awk 'NR > 1 && $NF > 0 { found = 1; exit } END { exit !found }' "${RUNNER_TEMP}/coverage-e2e.out"
      - name: Upload main coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out,${{ runner.temp }}/coverage-e2e.out
          flags: go
          plugins: noop
          fail_ci_if_error: true
          override_branch: main
          override_commit: ab83084030128585db1c434f0b5cabc4e333478d
