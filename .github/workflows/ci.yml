name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 60
    name: Check (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Run checks and collect E2E coverage
        env:
          MONARCH_E2E_COVER_DIR: ${{ runner.temp }}/monarch-e2e-coverage
        run: |
          mkdir -p "$MONARCH_E2E_COVER_DIR"
          mise run check
          go tool covdata textfmt -i="$MONARCH_E2E_COVER_DIR" -o="${RUNNER_TEMP}/coverage-e2e.out"
          test -s coverage.out
          test -s "${RUNNER_TEMP}/coverage-e2e.out"
          awk 'NR > 1 && $NF > 0 { found = 1; exit } END { exit !found }' "${RUNNER_TEMP}/coverage-e2e.out"
      - run: git diff --exit-code
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out,${{ runner.temp }}/coverage-e2e.out
          flags: go
          plugins: noop
          fail_ci_if_error: false

  matrix:
    timeout-minutes: 60
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: mise run test
      - run: mise run build

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: jactionlint
        uses: jdx/jactionlint@a65ab044e916760429068fe5794b8306abdfcbb9 # v2.3.0
        with:
          profile: default
