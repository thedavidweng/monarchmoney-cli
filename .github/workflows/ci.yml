name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 60
    name: Check (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - name: Run checks and collect E2E coverage
        env:
          MONARCH_E2E_COVER_DIR: ${{ runner.temp }}/monarch-e2e-coverage
        run: |
          mkdir -p "$MONARCH_E2E_COVER_DIR"
          mise run check
          go tool covdata textfmt -i="$MONARCH_E2E_COVER_DIR" -o="${RUNNER_TEMP}/coverage-e2e.out"
          test -s coverage.out
          test -s "${RUNNER_TEMP}/coverage-e2e.out"
          awk 'NR > 1 && $NF > 0 { found = 1; exit } END { exit !found }' "${RUNNER_TEMP}/coverage-e2e.out"
      - run: git diff --exit-code
      - run: bash scripts/test-codecov-keyring.sh
      - name: Prepare Codecov verification key
        id: codecov-key
        if: always()
        run: |
          curl -fsSL --retry 3 https://keybase.io/codecovsecops/pgp_keys.asc -o "$RUNNER_TEMP/codecov-key.asc"
          bash scripts/prepare-codecov-keyring.sh "$RUNNER_TEMP/codecov-key.asc" "$RUNNER_TEMP/codecov-keyring" '27034E7FDB850E0BBC2C62FF806BB28AED779869'
          echo "GNUPGHOME=$RUNNER_TEMP/codecov-keyring/trusted" >> "$GITHUB_ENV"
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always() && steps.codecov-key.outcome == 'success'
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: coverage.out,${{ runner.temp }}/coverage-e2e.out
          flags: go
          plugins: noop
          fail_ci_if_error: true

  matrix:
    timeout-minutes: 60
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - run: mise run test
      - run: mise run build

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: jactionlint
        uses: jdx/jactionlint@baa8d685e2b27ff5821558c9eeabb2051c1da61b # v2.4.0
        with:
          profile: default
