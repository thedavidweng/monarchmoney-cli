query Common_BudgetSettings {
  budgetSystem
  budgetApplyToFutureMonthsDefault
  budgetStatus {
    hasBudget
    hasTransactions
    willCreateBudgetFromEmptyDefaultCategories
  }
  flexExpenseRolloverPeriod {
    id
    startMonth
    endMonth
    startingBalance
    frequency
    targetAmount
    type
  }
}
