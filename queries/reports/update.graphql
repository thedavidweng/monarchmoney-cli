mutation Web_UpdateReportConfiguration($input: UpdateReportConfigurationInput!) {
  updateReportConfiguration(input: $input) {
    reportConfiguration {
      id
      displayName
    }
    errors {
      ...PayloadErrorFields
    }
  }
}

fragment PayloadErrorFields on PayloadError {
  fieldErrors {
    field
    messages
  }
  message
  code
}
