query Common_GetEditMerchant($merchantId: ID!) {
  merchant(id: $merchantId) {
    ...MerchantFields
  }
}

fragment MerchantFields on Merchant {
  id
  name
  logoUrl
  transactionCount
  ruleCount
  canBeDeleted
  createdAt
  defaultCategory {
    id
    name
  }
  defaultCategoryApplicationMode
  showDefaultCategoryPrompt
  recurringTransactionStream {
    id
  }
}
