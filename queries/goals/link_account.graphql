mutation Common_CreateSavingsGoalAccountInitialContributions($input: GoalAccountInitialContributionInput!) {
  createGoalAccountInitialContributions(input: $input) {
    userNotice
    errors {
      ...PayloadErrorFields
    }
  }
}

fragment PayloadErrorFields on PayloadError {
  fieldErrors {
    field
    messages
  }
  message
  code
}
