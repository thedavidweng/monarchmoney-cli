query Common_SavingsGoalBudgetAmounts(
  $goalId: ID!
  $startMonth: Date!
  $endMonth: Date!
) {
  savingsGoal(id: $goalId) {
    id
    monthlyBudgetAmounts(startMonth: $startMonth, endMonth: $endMonth) {
      id
      month
      plannedAmount
      actualAmount
      remainingAmount
    }
  }
}
