mutation Common_DeleteCategoryGroup($id: UUID!, $moveToGroupId: UUID) {
  deleteCategoryGroup(id: $id, moveToGroupId: $moveToGroupId) {
    deleted
    errors {
      ...PayloadErrorFields
    }
  }
}

fragment PayloadErrorFields on PayloadError {
  fieldErrors {
    field
    messages
  }
  message
  code
}
