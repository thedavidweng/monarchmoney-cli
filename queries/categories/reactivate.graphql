mutation Web_RestoreCategory($id: UUID!) {
  restoreCategory(id: $id) {
    errors {
      ...PayloadErrorFields
    }
    category {
      ...CategoryFields
    }
  }
}

fragment CategoryFields on Category {
  id
  order
  name
  icon
  group {
    id
    name
    type
  }
}

fragment PayloadErrorFields on PayloadError {
  fieldErrors {
    field
    messages
  }
  message
  code
}
