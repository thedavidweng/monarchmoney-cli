mutation Common_CreateTransactionTag(
  $input: CreateTransactionTagInput!
) {
  createTransactionTag(input: $input) {
    tag {
      ...TagFields
    }
    errors {
      ...PayloadErrorFields
    }
  }
}

fragment TagFields on TransactionTag {
  id
  name
  color
  order
}

fragment PayloadErrorFields on PayloadError {
  fieldErrors {
    field
    messages
  }
  message
  code
}
